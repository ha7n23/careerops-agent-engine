name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run linting
        run: uv run ruff check . --fix

      - name: Run type checking
        run: uv run python -m mypy src

      - name: Run tests
        run: uv run pytest


  container:
    name: Container Integration
    runs-on: ubuntu-latest
    needs:
      - quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create CI environment
        run: |
          cat > .env <<'EOF'
          CAREEROPS_APP_NAME="CareerOps Agent Engine"
          CAREEROPS_APP_VERSION="0.1.0"
          CAREEROPS_ENVIRONMENT="test"
          CAREEROPS_DEBUG=false

          CAREEROPS_AUTH_MODE="development"

          CAREEROPS_LLM_PROVIDER="google"
          CAREEROPS_LLM_MODEL="gemini-3.5-flash"
          CAREEROPS_LLM_TEMPERATURE=1.0
          CAREEROPS_LLM_TIMEOUT_SECONDS=60
          CAREEROPS_LLM_MAX_RETRIES=2
          CAREEROPS_LLM_REQUESTS_PER_MINUTE=4

          GOOGLE_API_KEY=

          LANGSMITH_TRACING=false
          LANGSMITH_HIDE_INPUTS=true
          LANGSMITH_HIDE_OUTPUTS=true

          CAREEROPS_EVIDENCE_AGENT_MAX_MODEL_CALLS=6
          CAREEROPS_EVIDENCE_AGENT_MAX_TOOL_CALLS=4
          CAREEROPS_EVIDENCE_AGENT_MAX_SEARCH_CALLS=3
          CAREEROPS_EVIDENCE_AGENT_RECURSION_LIMIT=50

          LANGGRAPH_STRICT_MSGPACK=true
          EOF

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production container
        run: docker compose build api

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Run database initialization
        run: docker compose run --rm migrate

      - name: Start CareerOps API
        run: docker compose up -d api

      - name: Wait for container health
        run: |
          for attempt in $(seq 1 30); do
            status="$(
              docker inspect \
                --format='{{.State.Health.Status}}' \
                careerops-api
            )"

            echo "CareerOps container health: ${status}"

            if [ "${status}" = "healthy" ]; then
              exit 0
            fi

            if [ "${status}" = "unhealthy" ]; then
              docker compose logs api
              exit 1
            fi

            sleep 2
          done

          docker compose logs api
          exit 1

      - name: Verify liveness
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8000/health

      - name: Verify readiness
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8000/ready

      - name: Verify non-root runtime
        run: |
          runtime_user="$(
            docker compose exec -T api id -u
          )"

          echo "CareerOps runtime UID: ${runtime_user}"

          test "${runtime_user}" = "10001"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Shut down containers
        if: always()
        run: docker compose down --volumes